<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parcours Creative Developer</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; padding: 48px 24px; background: #0e0e10; color: #eee; }
      main { max-width: 720px; margin: 0 auto; }
      h1 { font-weight: 500; letter-spacing: -0.02em; }
      h2 { margin-top: 32px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; color: #888; }
      ul { list-style: none; padding: 0; margin: 0; }
      a { display: block; padding: 10px 0; color: #eee; text-decoration: none; border-bottom: 1px solid #222; }
      a:hover { color: #9fd; }
    </style>
  </head>
  <body>
    <main>
      <h1>Parcours Creative Developer</h1>
      <div id="list"></div>
    </main>
    <script type="module">
      // Liste auto de chaque page d'exercice ou projet (tout index.html sous weeks/ et projects/)
      const pages = Object.keys({
        ...import.meta.glob('/weeks/**/index.html'),
        ...import.meta.glob('/projects/**/index.html'),
      }).sort();
      const groups = {};
      for (const p of pages) {
        const [, root, group] = p.split('/');
        (groups[`${root}/${group}`] ||= []).push(p);
      }
      const list = document.getElementById('list');
      for (const [g, items] of Object.entries(groups)) {
        list.insertAdjacentHTML('beforeend', `<h2>${g}</h2><ul>${items
          .map((p) => `<li><a href="${p.replace('index.html', '')}">${p.split('/').slice(3, -1).join(' / ') || g}</a></li>`)
          .join('')}</ul>`);
      }
      if (!pages.length) list.textContent = 'Aucun exercice pour le moment.';
    </script>
  </body>
</html>
